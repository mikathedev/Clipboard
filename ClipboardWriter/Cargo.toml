[package]
name = "ClipboardWriter"
version = "0.1.0"
edition = "2024"

[dependencies]
home = "0.5.12"
wayland-clipboard-listener = "0.6.1"
glib.workspace = true
image = { version = "0.25.10", default-features = false, features = ["webp", "png", "jpeg"] }
rusqlite.workspace = true
reqwest = "0.13.5"
regex = "1.13.1"
tokio = { version = "1", features = ["full"] }
log = "0.4.34"
env_logger = "0.11.11"
